name: Deploy TanStack Start to GitHub Pages

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify required public files
        run: |
          test -s .output/public/index.html
          cmp public/app-ads.txt .output/public/app-ads.txt
          cmp public/patang-pop/privacy.html .output/public/patang-pop/privacy.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./.output/public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
